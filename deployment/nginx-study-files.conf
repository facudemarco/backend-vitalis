# Replace ONLY the existing studies/files/public location in vitalis.conf.
# Do not retain its alias/try_files rules: they bypass the API's access checks.
# Apply manually together with the backend release; no VPS changes are automated.
location ^~ /MdpuF8KsXiRArNlHtl6pXO2XyLSJMTQ8_Vitalis/api/studies/files/public/ {
    proxy_pass http://127.0.0.1:8010/studies/files/public/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
}
